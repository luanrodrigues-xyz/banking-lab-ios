name: BankingLab
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  BankingLab:
    type: application
    platform: iOS
    sources:
      - BankingLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanrodrigues.bankinglab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BankingLab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: BankingLab/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  BankingLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BankingLabTests
    dependencies:
      - target: BankingLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanrodrigues.bankinglab.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  BankingLab:
    build:
      targets:
        BankingLab: all
    test:
      gatherCoverageData: true
      targets:
        - BankingLabTests
